<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <body class="bg-[#f8fafc] dark:bg-[#090d13] text-slate-900 dark:text-slate-100 min-h-screen selection:bg-teal-500 selection:text-white antialiased overflow-x-hidden">

        window.addEventListener('load', () => {

          });
        });
      }
    </script>
